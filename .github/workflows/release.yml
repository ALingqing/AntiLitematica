name: Release

# 推送 tag（如 v1.1.0）时自动构建并发布 GitHub Release
# 与插件内置更新检查器联动：https://api.github.com/repos/EpochcraftMC/AntiLitematica/releases/latest
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --no-transfer-progress -DskipTests

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/AntiLitematica-*.jar
          generate_release_notes: true
