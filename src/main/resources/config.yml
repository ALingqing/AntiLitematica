# =====================================================================
# AntiLitematica Configuration
# Config version (auto-managed by ConfigMigrator, do not edit)
# =====================================================================
config_version: 3

# -------------------------------------------------------------------
# 1. GLOBAL SETTINGS
# -------------------------------------------------------------------
# Master switch. Set to false to disable all plugin functionality.
enabled: true

# -------------------------------------------------------------------
# 2. LOCALE & MESSAGES
# -------------------------------------------------------------------
# Server-wide default language (fallback when auto-locale cannot match).
# Options: zh_CN / en_US / zh_TW
# Language files are stored in the lang/ folder.
lang: "zh_CN"

# Auto-detect each player's client language.
# When enabled, messages are shown in the player's own language
# (e.g. Chinese players see Chinese, German players see German).
# Falls back to 'locale' setting if the player's language is not available.
auto_locale: true

# Messages are in messages.yml - edit that file to customize messages.
# The plugin will look for messages_<locale>.yml for each language.
# Messages are reloaded with /antilitematica reload

# -------------------------------------------------------------------
# 3. DETECTION
# -------------------------------------------------------------------
detection:
  enabled: true
  # Plugin channels to monitor (lowercase, exact match).
  # Litematica 1.21.11+ uses `servux:litematics` via Servux integration.
  channels:
    - "servux:litematics"
  # Keep this list short to reduce false positives.

  # Actively block servux:litematics payloads (prevents projection data sync).
  block_servux: true

  # Commands to execute on detection (used when action=COMMANDS).
  # Placeholders: %player% %uuid% %reason% %channel% %why%
  commands: []
  # Whether to kick the player after executing commands.
  kick_after_commands: true

  # ProtocolLib signals: catch Litematica behavior even if Servux sync is disabled.
  signals:
    servux_metadata:
      enabled: true   # VarInt type=2 + NBT["version"] contains "litematica"

    easy_place:
      enabled: true   # Abnormal hit-vector indicates EasyPlace protocol
      rel_min: -0.5
      rel_max: 1.5
      cancel_packet: false

    nbt_query:
      enabled: true   # Debug NBT queries (block entity / entity tag)
      allow_op: true
      cancel_packet: true

  # Action on detection hit: LOG / KICK / BAN / COMMANDS
  action: "KICK"
  # Punishment reason (for BAN / COMMANDS placeholders)
  reason: "Forbidden client mod detected (Litematica)."

# -------------------------------------------------------------------
# 4. ANTI-PRINTER
# -------------------------------------------------------------------
anti_printer:
  enabled: true
  apply_to_creative: true

  # Force server-side raytrace: player must look at the block they place.
  enforce_raytrace: true
  reach_survival: 5.0
  reach_creative: 6.0
  extra_reach_allowance: 0.25

  # Placement rate limit (blocks/second). Set to 0 to disable.
  max_blocks_per_second: 14

  # Detect consecutive same-type block placement (bots place identical blocks).
  detect_consecutive_same_type: true
  consecutive_same_type_threshold: 6

  # Detect no-look-change placement (humans micro-adjust aim, bots do not).
  detect_no_look_change: true
  no_look_change_threshold: 5

  # Violation tracking within time window
  violations:
    window_ms: 8000
    kick_at: 8

# -------------------------------------------------------------------
# 5. COMMAND GUARD
# -------------------------------------------------------------------
# Blocks rapid command execution (e.g. /setblock spam from schematic quick-paste).
command_guard:
  enabled: true
  # Commands to block (prefix match, case-insensitive)
  blocked_commands:
    - "/setblock"
  # Commands to NEVER block (exceptions, takes priority over blocked_commands)
  allowed_commands:
    - "/msg"
    - "/tell"
    - "/r"
  max_per_window: 8
  window_ms: 3000
  violations:
    window_ms: 8000
    kick_at: 5

# -------------------------------------------------------------------
# 6. GRADUATED PUNISHMENT
# -------------------------------------------------------------------
graduated_punishment:
  enabled: true

  # Time window (minutes) for counting violations
  window_minutes: 60

  # Storage: sqlite / mysql / memory
  # sqlite  - stores data in violations.db file (default)
  # mysql   - stores data in MySQL/MariaDB (requires mysql config below)
  # memory  - RAM only (lost on restart, for testing only)
  storage: sqlite

  # MySQL configuration (only used when storage: mysql)
  mysql:
    host: "localhost"
    port: 3306
    database: "antilitematica"
    user: "root"
    password: ""

  # Escalation levels (executed in order based on violation count)
  levels:
    1:
      action: warn
      duration: "0"
      reason: "使用投影模组 - 警告 (1/3)"
      broadcast: false
      staff_alert: true
    2:
      action: tempban
      duration: "30m"
      reason: "多次使用投影模组 - 临时封禁 (2/3)"
      broadcast: true
      staff_alert: true
    3:
      action: ban
      duration: "0"
      reason: "屡次使用投影模组 - 永久封禁 (3/3)"
      broadcast: true
      staff_alert: true

  # Action when exceeding max level
  exceed_max:
    action: ban
    duration: "0"
    reason: "违规次数过多 - 永久封禁"

  # Ban plugin priority (tried in order)
  ban_plugins:
    - "LiteBans"
    - "AdvancedBan"
    - "EssentialsX"

# -------------------------------------------------------------------
# 7. ANTI-CHEAT INTEGRATION
# -------------------------------------------------------------------
integration:
  enabled: false
  # Options: grim / vulcan / matrix / none
  type: "none"
  violation_level: 10
  check_prefix: "AntiLitematica"

# -------------------------------------------------------------------
# 8. VIOLATION WHITELIST
# -------------------------------------------------------------------
whitelist:
  enabled: false
  # LOG_ONLY: log only, no punishment
  # NORMAL:   bypass all checks entirely
  mode: "LOG_ONLY"
  # Player names (case-insensitive, stored lowercase)
  players: []

# -------------------------------------------------------------------
# 8b. WORLD IGNORE LIST
# -------------------------------------------------------------------
# Players in these worlds will NOT be checked at all.
# Useful for build/creative worlds where schematic use is legitimate.
world_whitelist:
  enabled: false
  worlds: []

# -------------------------------------------------------------------
# 9. NOTIFICATIONS
# -------------------------------------------------------------------

# 9a. Discord Webhook
discord:
  enabled: false
  webhook_url: ""
  username: "AntiLitematica"
  embed_title: "Forbidden client detected"
  embed_color: 16711680
  notify_on_detection: true
  notify_on_punish: true
  # Proxy (optional)
  # proxy_host: "127.0.0.1"
  # proxy_port: 7890
  # proxy_username: ""
  # proxy_password: ""

# 9b. OneBot 11 (QQ Bot)
onebot:
  enabled: false
  http_url: "http://localhost:5700"
  access_token: ""
  group_id: 0

# -------------------------------------------------------------------
# 10. WEB DASHBOARD
# -------------------------------------------------------------------
web_dashboard:
  enabled: false
  port: 25418
  password: "admin"
  locale: "zh_CN"

# -------------------------------------------------------------------
# 11. DYNAMIC THRESHOLD
# -------------------------------------------------------------------
dynamic_threshold:
  enabled: false
  check_interval_seconds: 30
  tps:
    high: 19.5
    low: 16.0
  players:
    high: 50
    low: 5
  multiplier:
    min: 1.0
    max: 2.0

# -------------------------------------------------------------------
# 12. DETECTION LOG
# -------------------------------------------------------------------
detection_log:
  enabled: false
  file: "detections.log"

# -------------------------------------------------------------------
# 12b. STATISTICS & CLEANUP
# -------------------------------------------------------------------
stats:
  # Enable detection statistics tracking (daily counts, hit rates)
  enabled: true
  # Auto-cleanup: days to keep violation records (0 = forever)
  record_retention_days: 30
  # Auto-cleanup: days to keep stats (0 = forever)
  stats_retention_days: 90

# -------------------------------------------------------------------
# 13. AUTO UPDATE (GitHub Release Download)
# -------------------------------------------------------------------
auto_build:
  enabled: false
  output_path: ""
  nightly_time: "03:00"
  auto_reload: false
  post_build_command: ""

# -------------------------------------------------------------------
# 14. METRICS
# -------------------------------------------------------------------
bstats:
  enabled: true
