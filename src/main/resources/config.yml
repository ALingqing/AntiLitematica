# AntiLitematica Configuration

enabled: true

# bStats metrics (plugin usage statistics)
bstats:
  enabled: true

# Dynamic threshold adjustment
# Automatically adjusts detection sensitivity based on server TPS and online player count.
# When TPS is low or many players are online, thresholds become more lenient to reduce false positives.
dynamic_threshold:
  enabled: false
  check_interval_seconds: 30
  tps:
    high: 19.5
    low: 16.0
  players:
    high: 50
    low: 5
  multiplier:
    min: 1.0
    max: 2.0

# Messages are now in messages.yml - edit that file to customize messages.
# Messages are reloaded with /antilitematica reload

detection:
  enabled: true
  # If the client registers or sends data on any of the following channels, it is flagged as suspicious/violating (depending on the specific signal).
  # Note: Litematica 1.21.11 includes Servux integration and may use `servux:litematics`.
  channels:
    - "servux:litematics"
  # To reduce false positives, keep this list as short as possible; only append channels when confirmed necessary.

  # Actively block servux:litematics payloads to prevent projection data sync between client and server.
  block_servux: true

  # Only effective when action=COMMANDS:
  # Placeholders: %player% %uuid% %reason% %channel% %why%
  commands: []
  kick_after_commands: true

  # ProtocolLib-based extra signals: try to catch Litematica fingerprint behavior even if the player disables Servux sync.
  signals:
    # Detect Litematica Servux metadata request:
    # VarInt type=2 + NBT["version"] contains "litematica"
    servux_metadata:
      enabled: true

    # Detect Litematica "Easy Place" protocol:
    # It encodes protocol data into the hit vector, causing hitVec relative to blockPos to far exceed normal range.
    # Calculation: rel = hitVec - blockPos; vanilla is usually within [0..1] (allowing small error), Litematica may be > 2.
    easy_place:
      enabled: true
      rel_min: -0.5
      rel_max: 1.5
      cancel_packet: false

    # Detect debug NBT queries (block entity / entity tag query).
    # Normal players should not send such packets (usually related to OP/debug features).
    nbt_query:
      enabled: true
      allow_op: true
      cancel_packet: true

  # Action after detection hit:
  # - LOG: log only
  # - KICK: kick the player
  # - BAN: use the server's built-in name ban, then kick
  # - COMMANDS: execute commands as console (can interface with ban plugins), optionally kick after execution
  action: "KICK"

  # Punishment reason (placeholder for BAN / COMMANDS)
  reason: "Forbidden client mod detected (Litematica)."

# Discord Webhook notification settings
discord:
  enabled: false
  # Webhook URL (can be created in Discord server settings -> Integrations)
  webhook_url: ""
  # Sender name
  username: "AntiLitematica"
  # Embed message title
  embed_title: "Forbidden client detected"
  # Embed color (decimal color value, e.g. 16711680 = red)
  embed_color: 16711680
  # Whether to send notification on detection (regardless of punishment)
  notify_on_detection: true
  # Whether to send notification when punishment is executed
  notify_on_punish: true
  # Proxy settings (leave empty to disable)
  # proxy_host: "127.0.0.1"
  # proxy_port: 7890
  # proxy_username: ""  # optional, for authenticated proxies
  # proxy_password: ""  # optional, for authenticated proxies

anti_printer:
  enabled: true
  apply_to_creative: true

  # Force server-side ray trace to hit the "block the placement relies on" (or in rare cases the already placed block).
  # This prevents printers that can auto-place without looking at blocks.
  enforce_raytrace: true
  reach_survival: 5.0
  reach_creative: 6.0
  extra_reach_allowance: 0.25

  # Placement rate limit (max blocks placed per second). Set to 0 to disable.
  max_blocks_per_second: 14

  # Detect consecutive placement of the same block type within 3 seconds.
  # Printer bots often place many identical blocks in a row.
  detect_consecutive_same_type: true
  consecutive_same_type_threshold: 6

  # Detect placement without any look (yaw/pitch) change between placements.
  # Humans almost always micro-adjust their aim; printers often do not.
  detect_no_look_change: true
  no_look_change_threshold: 5

  # Within the time window, if a player exceeds speed / ray trace check failure accumulates to the threshold, kick.
  violations:
    window_ms: 8000
    kick_at: 8

# Detect Litematica "quick paste" abuse via rapid command execution.
# Litematica's executeOperation can spam /setblock or other configured commands.
command_guard:
  enabled: true
  # Commands to block entirely (prefix match, case-insensitive).
  blocked_commands:
    - "/setblock"
  # Max allowed commands within window_ms before flagging as burst.
  max_per_window: 8
  window_ms: 3000
  violations:
    window_ms: 8000
    kick_at: 5
    
# Graduated punishment system (replaces single KICK/BAN with escalating penalties)
graduated_punishment:
  enabled: true

  # Time window (minutes) for counting violations
  window_minutes: 60

  # Storage: sqlite / memory
  storage: sqlite

  # Punishment levels (executed in order based on violation count)
  levels:
    1:
      action: warn
      duration: "0"
      reason: "使用投影模组 - 警告 (1/3)"
      broadcast: false
      staff_alert: true
    2:
      action: tempban
      duration: "30m"
      reason: "多次使用投影模组 - 临时封禁 (2/3)"
      broadcast: true
      staff_alert: true
    3:
      action: ban
      duration: "0"
      reason: "屡次使用投影模组 - 永久封禁 (3/3)"
      broadcast: true
      staff_alert: true

  # Action when exceeding max level
  exceed_max:
    action: ban
    duration: "0"
    reason: "违规次数过多 - 永久封禁"

  # Ban plugin priority (tried in order)
  ban_plugins:
    - "LiteBans"
    - "AdvancedBan"
    - "EssentialsX"

# Anti-cheat integration settings
integration:
  enabled: false
  # Options: grim / none
  type: "none"
  violation_level: 10
  check_prefix: "AntiLitematica"

# Locale setting for messages
# Options: zh_CN / en_US / zh_TW / default
# The plugin will look for messages_<locale>.yml in the plugin folder.
# Falls back to messages.yml if locale file not found.
locale: "zh_CN"

# Violation whitelist: players who trigger detection but only get logged,
# no punishment is applied. Useful for testing or trusted builders.
whitelist:
  enabled: false
  # LOG_ONLY: log detection but do not punish
  # NORMAL: bypass all checks entirely
  mode: "LOG_ONLY"
  # List of player names (case-insensitive, will be matched lowercase)
  players: []

# Built-in web dashboard
# Provides a web interface to monitor detections and manage the plugin.
# Default port: 25418
# Access: http://<your-server-ip>:25418
web_dashboard:
  enabled: false
  port: 25418
  # Password to access the dashboard
  password: "admin"
  # Dashboard UI language: zh_CN / en_US / zh_TW
  locale: "zh_CN"

# Auto update & deploy
# Automatically downloads the latest AntiLitematica release JAR from GitHub Releases
# and saves it to the server plugins folder.
# The download runs asynchronously and does not block the server.
auto_build:
  enabled: false
  # Path to the server plugins folder where the downloaded JAR will be placed
  output_path: ""
  # Nightly auto-update time (24-hour format, server local time)
  # Set to empty string "" to disable nightly auto-updates
  nightly_time: "03:00"
  # Whether to run /plugman reload AntiLitematica after successful download (requires PlugManX)
  auto_reload: false
  # Custom command to run after successful download (e.g., "plugman reload AntiLitematica")
  # If empty, uses the auto_reload setting above
  post_build_command: ""
