# 修改后执行 /antilitematica reload 生效

# 语言标识（用于识别当前语言，请勿修改）
lang: zh_cn

# 通用
common.no-permission: "&c你没有权限执行该命令"
common.player-only: "&c该命令仅限玩家使用"
