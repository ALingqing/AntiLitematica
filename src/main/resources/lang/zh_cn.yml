common.not-found: "&c未找到: {target}"
common.invalid-number: "&c无效的数字: {value}"

# 动作 / 预设名称（面向玩家显示）
action.KICK: "踢出"
action.BAN: "封禁"
action.WARN: "警告"
action.LOG: "记录"
mode.STRICT: "严格模式"
mode.NORMAL: "标准模式"
mode.LITE: "轻量模式"

# 检测
detection.kick: "&c检测到你安装了不允许的 Mod（{mod}），&7请移除后重新加入服务器！"
detection.warn: "&e[提示] &7检测到你安装了 {mod}，&e服务器不允许使用该 mod，请尽快退出！"
detection.notify-admin: "§e{player} §7因安装禁用 Mod（{mod}，通道 {channel}）被处理: §f{action}"
detection.ban-reason: "自动封禁：多次检测到安装禁用 Mod（{channel}）"

# 封禁
ban.login: "&c你已被封禁！\n&7原因: &f{reason}\n&7剩余时间: &f{expires}"
ban.kick: "&c你已被封禁！\n&7原因: &f{reason}\n&7剩余时间: &f{expires}"
ban.success: "&a已封禁 &f{player} &a原因: &f{reason}&a 时长: &f{duration}"
ban.unban: "&a已解封 &f{player}"
ban.list-empty: "&7当前没有封禁记录"
ban.reason-admin: "管理员封禁"

